name: Build QMK Firmware (Manual Select)
on:
  workflow_dispatch:  # 仅允许手动触发
    inputs:
      keyboard_path:
        description: '要编译的键盘路径 (例如: xtips/p25s/v2)'
        required: true
        type: string
        default: 'xtips/p25s/v2'  # 设置一个常用型号作为默认值
      keymap:
        description: '键映射名称 (例如: vial 或 default)'
        required: false
        type: string
        default: 'vial'

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
    - name: Disable git safe directory checks
      run: git config --global --add safe.directory '*'

    - name: Checkout QMK Firmware
      uses: actions/checkout@v4
      with:
        repository: qmk/qmk_firmware
        submodules: recursive

    - name: Checkout your keyboard definitions
      uses: actions/checkout@v4
      with:
        path: users/${{ github.actor }}

    - name: Build the specified firmware
      run: |
        echo "开始编译: ${{ github.event.inputs.keyboard_path }} (键映射: ${{ github.event.inputs.keymap }})"
        qmk compile -kb ${{ github.event.inputs.keyboard_path }} -km ${{ github.event.inputs.keymap }}
      working-directory: qmk_firmware

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware_${{ github.event.inputs.keyboard_path }}
        path: qmk_firmware/xtips_*.bin qmk_firmware/xtips_*.uf2  # 通配符捕获生成的固件
        if-no-files-found: warn