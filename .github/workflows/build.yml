name: Build QMK Firmware (Manual Select)
on:
  workflow_dispatch:
    inputs:
      keyboard_path:
        description: '要编译的键盘路径 (例如: xtips/p25s/v2)'
        required: true
        type: string
        default: 'xtips/p25s/v2'
      keymap:
        description: '键映射名称 (例如: vial 或 default)'
        required: false
        type: string
        default: 'vial'

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
    - name: Disable git safe directory checks
      run: git config --global --add safe.directory '*'

    - name: Checkout QMK Firmware
      uses: actions/checkout@v4
      with:
        repository: qmk/qmk_firmware
        submodules: recursive
        path: qmk_firmware

    - name: Checkout your keyboard definitions
      uses: actions/checkout@v4
      with:
        path: qmk_firmware/keyboards/xtips

    - name: Build the specified firmware
      working-directory: qmk_firmware
      run: |
        echo "开始编译: ${{ github.event.inputs.keyboard_path }} (键映射: ${{ github.event.inputs.keymap }})"
        # 使用宽松编译选项，匹配本地环境
        qmk compile -kb ${{ github.event.inputs.keyboard_path }} -km ${{ github.event.inputs.keymap }} --compiler-options="-Wno-error"

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware_${{ github.event.inputs.keyboard_path }}
        path: qmk_firmware/xtips_*.bin qmk_firmware/xtips_*.uf2
        if-no-files-found: warn